services:
  excalidraw:
    build:
      context: .
      target: frontend
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      drawings-api:
        condition: service_healthy

  drawings-api:
    build:
      context: .
      target: drawings-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DRAWINGS_DIR: /data/drawings
      PORT: "3001"
    volumes:
      - ./drawings:/data/drawings
